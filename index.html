<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAW Yard Control</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

    <!-- Cabecera tipo OneNote -->
    <header class="bg-white border-b border-gray-200 px-4 py-3 flex justify-between items-center sticky top-0 z-10 shadow-sm">
        <div>
            <h1 class="text-sm font-bold text-gray-800 uppercase tracking-wide">ZAW Yard Control</h1>
            <p class="text-[10px] text-gray-500">Live Fleet Management</p>
        </div>
        <button onclick="abrirModal()" class="bg-blue-600 hover:bg-blue-700 text-white w-9 h-9 rounded-full flex items-center justify-center font-bold text-lg shadow transition">
            +
        </button>
    </header>

    <!-- Contenido Principal: Tabla Limpia -->
    <main class="p-2 flex-1 max-w-4xl mx-auto w-full">
        <div class="bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs">
                    <thead>
                        <tr class="bg-gray-100 text-gray-600 border-b border-gray-200 uppercase text-[10px]">
                            <th class="p-2">VIN</th>
                            <th class="p-2">Location</th>
                            <th class="p-2">Chemistry</th>
                            <th class="p-2">HW / SW</th>
                            <th class="p-2 text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-vehiculos" class="divide-y divide-gray-100">
                        <tr>
                            <td colspan="5" class="p-4 text-center text-gray-400 italic">Loading fleet data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Ventana Modal para Añadir Vehículo (Oculta por defecto) -->
    <div id="modal-vehiculo" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-lg max-w-sm w-full p-5 space-y-4 shadow-xl relative animate-in fade-in zoom-in duration-150">
            <div class="flex justify-between items-center border-b pb-2">
                <h2 class="text-sm font-bold text-gray-800">Add New Vehicle</h2>
                <button onclick="cerrarModal()" class="text-gray-400 hover:text-gray-600 font-bold text-lg px-2">&times;</button>
            </div>

            <div class="space-y-3 text-xs">
                <div>
                    <label class="block font-medium text-gray-700 mb-1">VIN</label>
                    <input type="text" id="nuevo-vin" placeholder="e.g. 3230" class="w-full p-2 border border-gray-300 rounded uppercase">
                </div>
                <div>
                    <label class="block font-medium text-gray-700 mb-1">Location (Plaza)</label>
                    <input type="text" id="nuevo-location" placeholder="e.g. ZAW-04" class="w-full p-2 border border-gray-300 rounded uppercase">
                </div>
                <div>
                    <label class="block font-medium text-gray-700 mb-1">Chemistry</label>
                    <select id="nuevo-chemistry" class="w-full p-2 border border-gray-300 rounded bg-white">
                        <option value="NMC">NMC</option>
                        <option value="LFP">LFP</option>
                    </select>
                </div>
            </div>

            <div class="flex space-x-2 pt-2">
                <button onclick="cerrarModal()" class="w-1/2 bg-gray-200 text-gray-700 py-2 rounded font-semibold hover:bg-gray-300 transition">Cancel</button>
                <button onclick="guardarNuevoVehiculo()" class="w-1/2 bg-blue-600 text-white py-2 rounded font-semibold hover:bg-blue-700 transition">Save</button>
            </div>
        </div>
    </div>

    <!-- Script de Supabase y Lógica -->
    <script>
        // --- PEGA TU CLAVE ANON DE SUPABASE AQUÍ ---
        const SUPABASE_URL = 'https://yypvitglzuraojaappyn.supabase.co';
        const SUPABASE_ANON_KEY = 'PEGA_AQUÍ_TU_CLAVE_ANON_PÚBLICA';
        // ------------------------------------------

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.onload = function() {
            cargarVehiculos();
        };

        function abrirModal() {
            document.getElementById('modal-vehiculo').classList.remove('hidden');
        }

        function cerrarModal() {
            document.getElementById('modal-vehiculo').classList.add('hidden');
            document.getElementById('nuevo-vin').value = '';
            document.getElementById('nuevo-location').value = '';
        }

        async function cargarVehiculos() {
            const tbody = document.getElementById('tabla-vehiculos');

            const { data, error } = await _supabase
                .from('vehiculos')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-red-500">Error loading data</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-400 italic">No vehicles found.</td></tr>`;
                return;
            }

            let html = '';
            data.forEach(v => {
                html += `
                    <tr class="hover:bg-gray-50 border-b border-gray-100">
                        <td class="p-2 font-bold text-gray-900">${v.vin || '-'}</td>
                        <td class="p-2">
                            <input type="text" value="${v.location || ''}"
                                onchange="actualizarCampo(${v.id}, 'location', this.value)"
                                class="w-full p-1 border border-transparent hover:border-gray-300 focus:border-blue-500 rounded bg-transparent uppercase font-semibold text-blue-600">
                        </td>
                        <td class="p-2">
                            <select onchange="actualizarCampo(${v.id}, 'chemistry', this.value)"
                                class="p-1 border border-transparent hover:border-gray-300 focus:border-blue-500 rounded bg-transparent text-gray-700 font-medium">
                                <option value="NMC" ${v.chemistry === 'NMC' ? 'selected' : ''}>NMC</option>
                                <option value="LFP" ${v.chemistry === 'LFP' ? 'selected' : ''}>LFP</option>
                            </select>
                        </td>
                        <td class="p-2 text-gray-500 text-[10px]">
                            HW: ${v.hw || '-'}<br>SW: ${v.sw || '-'}
                        </td>
                        <td class="p-2 text-center">
                            <button onclick="eliminarVehiculo(${v.id})" class="text-red-400 hover:text-red-600 font-bold px-1" title="Delete">×</button>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        async function guardarNuevoVehiculo() {
            const vin = document.getElementById('nuevo-vin').value.trim().toUpperCase();
            const location = document.getElementById('nuevo-location').value.trim();
            const chemistry = document.getElementById('nuevo-chemistry').value;

            if(!vin || !location) {
                alert('Please enter both VIN and Location.');
                return;
            }

            const { error } = await _supabase
                .from('vehiculos')
                .insert([{ vin, location, chemistry, power: 'ON' }]);

            if (error) {
                alert('Error: ' + error.message);
            } else {
                cerrarModal();
                cargarVehiculos();
            }
        }

        async function actualizarCampo(id, campo, valor) {
            const { error } = await _supabase
                .from('vehiculos')
                .update({ [campo]: valor })
                .eq('id', id);

            if (error) {
                alert('Error updating field: ' + error.message);
                cargarVehiculos();
            }
        }

        async function eliminarVehiculo(id) {
            if(confirm('Are you sure you want to delete this vehicle?')) {
                const { error } = await _supabase
                    .from('vehiculos')
                    .delete()
                    .eq('id', id);

                if(error) {
                    alert('Error deleting: ' + error.message);
                } else {
                    cargarVehiculos();
                }
            }
        }
    </script>
</body>
</html>
